name: Deploy to Firebase

"on":
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build and deploy to Firebase
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build game client
        run: pnpm --filter @workspace/killer-pool run build

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          create_credentials_file: true
          export_environment_variables: true

      - name: Validate Firebase credentials
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          if [ -z "$FIREBASE_PROJECT_ID" ]; then
            echo "FIREBASE_PROJECT_ID secret is not configured"
            exit 1
          fi
          if [ -z "$GOOGLE_APPLICATION_CREDENTIALS" ] || [ ! -s "$GOOGLE_APPLICATION_CREDENTIALS" ]; then
            echo "Google service-account credentials were not created"
            exit 1
          fi
          firebase projects:list --non-interactive >/dev/null

      - name: Deploy Hosting (skip functions)
  run: firebase deploy --project kenyan-pool --only hosting --non-interactive

      - name: Deploy Functions
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: firebase deploy --project "$FIREBASE_PROJECT_ID" --only functions --non-interactive

      - name: Show production URL
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: echo "Firebase Hosting: https://${FIREBASE_PROJECT_ID}.web.app"
