name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: firebase-hosting-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Firebase CLI
        run: npm install -g firebase-tools

      - name: Auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Generate Firebase web configuration
        shell: bash
        run: |
          set -euo pipefail

          firebase apps:list WEB --project kenyan-pool --non-interactive --json > /tmp/firebase-apps.json

          WEB_APP_ID="$(node <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync('/tmp/firebase-apps.json', 'utf8'));
          const apps = payload?.result ?? [];
          const app = apps.find((item) => item.platform === 'WEB');
          if (!app?.appId) {
            console.error('No Firebase Web App is registered for project kenyan-pool.');
            process.exit(1);
          }
          process.stdout.write(app.appId);
          NODE
          )"

          firebase apps:sdkconfig WEB "$WEB_APP_ID" --project kenyan-pool --non-interactive --json > /tmp/firebase-sdkconfig.json

          node <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync('/tmp/firebase-sdkconfig.json', 'utf8'));
          const config = payload?.result?.sdkConfig ?? payload?.result;
          const required = {
            VITE_FIREBASE_API_KEY: config?.apiKey,
            VITE_FIREBASE_AUTH_DOMAIN: config?.authDomain,
            VITE_FIREBASE_DATABASE_URL: config?.databaseURL,
            VITE_FIREBASE_PROJECT_ID: config?.projectId,
            VITE_FIREBASE_STORAGE_BUCKET: config?.storageBucket,
            VITE_FIREBASE_MESSAGING_SENDER_ID: config?.messagingSenderId,
            VITE_FIREBASE_APP_ID: config?.appId,
            VITE_FIREBASE_MEASUREMENT_ID: config?.measurementId,
          };

          const missing = [
            'VITE_FIREBASE_API_KEY',
            'VITE_FIREBASE_AUTH_DOMAIN',
            'VITE_FIREBASE_DATABASE_URL',
            'VITE_FIREBASE_PROJECT_ID',
            'VITE_FIREBASE_APP_ID',
          ].filter((key) => !required[key]);

          if (missing.length) {
            console.error(`Firebase web config is incomplete. Missing: ${missing.join(', ')}`);
            process.exit(1);
          }

          const envPath = 'artifacts/killer-pool/.env.production';
          fs.writeFileSync(
            envPath,
            Object.entries(required)
              .filter(([, value]) => value)
              .map(([key, value]) => `${key}=${JSON.stringify(value)}`)
              .join('\n') + '\n',
            { encoding: 'utf8', mode: 0o600 },
          );

          console.log('Firebase Web configuration generated for the production build.');
          console.log(`Firebase project: ${required.VITE_FIREBASE_PROJECT_ID}`);
          console.log(`Firebase Web App ID: ${required.VITE_FIREBASE_APP_ID}`);
          console.log('Realtime Database URL: configured');
          NODE

      - name: Build
        run: pnpm --filter @workspace/killer-pool run build

      - name: Deploy
        run: firebase deploy --project kenyan-pool --only hosting --non-interactive

      - name: URL
        run: echo "Deployed to https://kenyan-pool.web.app"
