name: Gameplay Regression Contracts

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'fix/**', 'feature/**', 'ci/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gameplay-regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Gameplay regression contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run gameplay regression contracts
        run: node scripts/gameplay-regression.mjs

      - name: Typecheck
        run: pnpm --filter @workspace/killer-pool run typecheck