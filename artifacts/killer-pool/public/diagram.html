<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#222;color:#fff;font:12px monospace}</style></head>
<body><svg id="s" width="384" height="690" xmlns="http://www.w3.org/2000/svg"></svg>
<pre id="out"></pre>
<script>
// ===== PARAMS TO TUNE =====
const BALL_R=2.86, CD=5;
const PLAY_W=99.1, PLAY_L=198.1;          // nose-to-nose rolling area
const PW=PLAY_W/2, PL=PLAY_L/2;           // 49.55 / 99.05
const Mc=3.77;                            // corner nose setback
const Ms=2.9;                             // side nose setback
const Cs=CD*Math.tan(38*Math.PI/180);     // 3.906 side facing recede
const Bc=1.3;                             // corner pocket back-offset (diagonal, each axis)
const Bs=1.3;                             // side pocket back-offset (outward x)
const rCorner=BALL_R*2.02, rSide=BALL_R*2.27;
// ==========================
const RX=PW-BALL_R, RZ=PL-BALL_R;
const BALLS={3:[0,0],4:[-24,-RZ],15:[24,-RZ],6:[-24,RZ],13:[24,RZ],
7:[-RX,-65],8:[-RX,-22],11:[-RX,22],12:[-RX,65],
9:[RX,-65],10:[RX,-22],14:[RX,22],5:[RX,65]};
const S=3, OFX=60, OFZ=110;
const X=x=>(x+OFX)*S, Z=z=>(z+OFZ)*S;
const svg=document.getElementById('s'), n='http://www.w3.org/2000/svg';
function poly(pts,fill,stroke){let p=document.createElementNS(n,'polygon');
 p.setAttribute('points',pts.map(([x,z])=>X(x)+','+Z(z)).join(' '));
 p.setAttribute('fill',fill);p.setAttribute('stroke',stroke);p.setAttribute('stroke-width','0.4');svg.appendChild(p);}
function circ(x,z,r,fill,stroke,sw){let c=document.createElementNS(n,'circle');
 c.setAttribute('cx',X(x));c.setAttribute('cy',Z(z));c.setAttribute('r',r*S);
 c.setAttribute('fill',fill);if(stroke){c.setAttribute('stroke',stroke);c.setAttribute('stroke-width',sw||0.6);}svg.appendChild(c);}
function line(a,b,col){let l=document.createElementNS(n,'line');
 l.setAttribute('x1',X(a[0]));l.setAttribute('y1',Z(a[1]));l.setAttribute('x2',X(b[0]));l.setAttribute('y2',Z(b[1]));
 l.setAttribute('stroke',col);l.setAttribute('stroke-width','1');svg.appendChild(l);}
// felt / rolling area
poly([[-PW,-PL],[PW,-PL],[PW,PL],[-PW,PL]],'#1A7238','#0a0');
// long rails (extend outward over rails)
for(const side of[-1,1])for(const zS of[-1,1]){
 const IX=side*PW,OX=side*(PW+CD);
 const czi=zS*(PL-Mc-CD),czo=zS*(PL-Mc),szi=zS*(Ms+Cs),szo=zS*Ms;
 poly([[IX,czi],[IX,szi],[OX,szo],[OX,czo]],'#0E5A2A','#3c6');}
// short rails
for(const end of[-1,1]){
 const iZ=end*PL,oZ=end*(PL+CD),ix=PW-Mc-CD,ox=PW-Mc;
 poly([[-ix,iZ],[ix,iZ],[ox,oZ],[-ox,oZ]],'#0E5A2A','#3c6');}
// pockets (recessed/back)
const P=[[-(PW+Bc),-(PL+Bc),rCorner],[PW+Bc,-(PL+Bc),rCorner],
 [-(PW+Bs),0,rSide],[PW+Bs,0,rSide],
 [-(PW+Bc),PL+Bc,rCorner],[PW+Bc,PL+Bc,rCorner]];
for(const[px,pz,r]of P)circ(px,pz,r,'#000','#a52',1);
// noses (red dots) + mouth measurement lines
const cornerNoseLong=[PW,PL-Mc-CD], cornerNoseShort=[PW-Mc-CD,PL];
const sideNoseA=[PW,Ms+Cs], sideNoseB=[PW,-(Ms+Cs)];
for(const p of[cornerNoseLong,cornerNoseShort,sideNoseA,sideNoseB])circ(p[0],p[1],0.6,'#f00');
line(cornerNoseLong,cornerNoseShort,'#ff0'); line(sideNoseA,sideNoseB,'#0ff');
// balls
for(const k in BALLS){const[x,z]=BALLS[k];circ(x,z,BALL_R,'#eee','#900',0.6);}
const cornerMouth=Math.hypot(cornerNoseLong[0]-cornerNoseShort[0],cornerNoseLong[1]-cornerNoseShort[1]);
const sideMouth=Math.hypot(sideNoseA[0]-sideNoseB[0],sideNoseA[1]-sideNoseB[1]);
document.getElementById('out').textContent=
 `nose-to-nose: ${(PW*2).toFixed(1)} x ${(PL*2).toFixed(1)} cm\n`+
 `corner mouth: ${cornerMouth.toFixed(2)} cm  (spec 12.1-12.7)\n`+
 `side mouth:   ${sideMouth.toFixed(2)} cm  (spec 13.3-14.0)\n`+
 `Mc=${Mc} Ms=${Ms} Cs=${Cs.toFixed(2)} Bc=${Bc} Bs=${Bs}`;
</script></body></html>
