kind = "web"
previewPath = "/"
title = "Killer Pool — Nairobi Nights"
version = "1.0.0"
id = "artifacts/killer-pool"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21182

[services.development]
run = "pnpm --filter @workspace/killer-pool run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/killer-pool", "run", "build" ]
publicDir = "artifacts/killer-pool/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21182"
BASE_PATH = "/"
